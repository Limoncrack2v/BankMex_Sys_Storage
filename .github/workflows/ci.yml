# Corre en cada PR lo mismo que la sección "Pruebas" del README:
# flutter analyze, flutter test y flutter test test_emulator.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Un push nuevo al mismo PR cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # La versión de Flutter con la que corren las pruebas. Al subirla, hay que
  # subirla también en dependency-scan.yml.
  FLUTTER_VERSION: 3.47.5
  FIREBASE_TOOLS_VERSION: 15.33.0
  # La app arma las fechas de caducidad con la hora local del dispositivo y
  # la Cloud Function cuenta los días en esta zona (TIME_ZONE en
  # functions/pantry.js). En UTC, que es la zona del runner, las pruebas de
  # test_emulator que comparan las dos salen con un día de menos.
  TZ: America/Mexico_City

jobs:
  analyze-and-test:
    name: flutter analyze y flutter test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # lib/firebase_options.dart está en .gitignore; sin él la app no compila.
      - name: Poner la configuración de Firebase de CI
        run: cp .github/ci/firebase_options.dart lib/firebase_options.dart
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test

  emulator-tests:
    name: flutter test test_emulator
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: functions/package-lock.json
      # Los emuladores piden Java 21 o más reciente.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      # firebase.json también está en .gitignore; el de CI solo trae las
      # reglas, la Cloud Function y los puertos de los emuladores.
      - name: Poner la configuración de Firebase de CI
        run: |
          cp .github/ci/firebase_options.dart lib/firebase_options.dart
          cp .github/ci/firebase.ci.json firebase.json
      - run: flutter pub get --enforce-lockfile
      - run: npm ci --prefix functions
      - run: npm install --global firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }}
      # Pruebas de la Cloud Function programada (node --test): las puras, y las
      # que usan el emulador de Firestore. El trigger programado no se dispara
      # en el emulador, así que se llama su lógica directo.
      - name: npm test (functions)
        run: npm test --prefix functions
      - name: npm run test:emulator (functions)
        run: >
          firebase emulators:exec
          --only firestore
          --project bank-storage-bamx
          "npm run test:emulator --prefix functions"
      - name: flutter test test_emulator
        run: >
          firebase emulators:exec
          --only auth,firestore,functions
          --project bank-storage-bamx
          "flutter test test_emulator"
